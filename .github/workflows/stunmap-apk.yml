name: STUNMAP — Build APK

on:
  push:
    branches:
      - claude/prd-review-build-0c8a7f
      - main
    paths:
      - 'stunmap/**'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('stunmap/gradle/libs.versions.toml', 'stunmap/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create placeholder GeoLite2 DB
        # The real mmdb must be added by the developer (see CLOUD.md).
        # An empty placeholder lets the build succeed; offline geo is
        # disabled at runtime when the file is corrupt/empty.
        run: touch stunmap/app/src/main/assets/GeoLite2-City.mmdb

      - name: Make gradlew executable
        run: chmod +x stunmap/gradlew

      - name: Run unit tests
        working-directory: stunmap
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        working-directory: stunmap
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: STUNMAP-debug-${{ github.sha }}
          path: stunmap/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Print APK info
        run: |
          apk_path=stunmap/app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -sh $apk_path | cut -f1)"
          echo "SHA256:   $(sha256sum $apk_path | cut -d' ' -f1)"
